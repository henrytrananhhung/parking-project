# Cloud Run -> Cloud SQL via the Cloud SQL Java Connector over private IP (Direct VPC egress).
# The connector always uses TLS, which satisfies the instance's enforced SSL mode.
# DB_PASSWORD and JWT_SECRET are injected from Secret Manager with `gcloud run deploy --set-secrets`.
spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&ipTypes=PRIVATE
    username: ${DB_USER}
    password: ${DB_PASSWORD}

parking:
  jwt:
    # No fallback: startup fails if the secret is not injected.
    secret: ${JWT_SECRET}
  kms:
    # projects/<p>/locations/<r>/keyRings/<ring>/cryptoKeys/<key>; KmsPasswordCipher fails fast if empty.
    key-name: ${KMS_KEY_NAME:}
