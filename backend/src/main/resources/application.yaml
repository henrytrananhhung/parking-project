spring:
  application:
    name: parking-reservation
  profiles:
    # Local development by default; Cloud Run sets SPRING_PROFILES_ACTIVE=gcp (or gcp,demo).
    default: local
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Show component status (e.g. db: UP) but never connection details.
      show-components: always

parking:
  jwt:
    # Base64 HMAC key (>= 32 bytes). Overridden by JWT_SECRET (Secret Manager) in the gcp profile.
    secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktand0LXNpZ25pbmcta2V5LTAxMjM0NTY3ODk=}
    ttl: ${JWT_TTL:12h}
  password-cipher:
    # Base64 AES-256 key for LocalAesPasswordCipher (non-gcp profiles only; gcp uses Cloud KMS).
    local-key: ${LOCAL_CIPHER_KEY:bG9jYWwtZGV2LW9ubHktYWVzLWtleS0wMTIzNDU2Nzg=}
  reservation:
    # Reservations for tomorrow open at this local time and stay open until midnight.
    open-time: ${RESERVATION_OPEN_TIME:20:00}
    # Business timezone (pending mentor confirmation).
    timezone: ${RESERVATION_TIMEZONE:Asia/Ho_Chi_Minh}
    price-cents: 1000
  wallet:
    max-deposit-cents: 100000
